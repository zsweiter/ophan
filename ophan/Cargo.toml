[package]
name = "ophan"
version = "0.1.32"
edition = "2024"

description = "High-performance reverse proxy, API gateway and load balancer"
license = "MIT"
repository = "https://github.com/zsweiter/ophan"

[package.metadata.deb]
maintainer = "Alex Zweiter <zsweiter@gmail.com>"
copyright = "2026, Alex Zweiter"
license-file = ["../LICENSE", "0"]
section = "httpd"
priority = "optional"
depends = ""
extended-description = """\
Ophan is a reverse proxy and API gateway built on Pingora: routing, load balancing, \
health checks, rate limiting, JWT authentication, CORS and static files, configured \
with a small DSL and reloaded without downtime."""
maintainer-scripts = "../packaging/deb/"
assets = [
    ["target/release/ophan", "usr/bin/", "755"],
    ["../defaults/config/master.conf", "etc/ophan/", "644"],
    ["../defaults/config/gateways/ophan.conf", "etc/ophan/gateways/", "644"],
    ["../defaults/www/index.html", "usr/share/ophan/www/", "644"],
    ["../defaults/www/favicon.svg", "usr/share/ophan/www/", "644"],
    ["../README.md", "usr/share/doc/ophan/README.md", "644"],
]
conf-files = ["/etc/ophan/master.conf", "/etc/ophan/gateways/ophan.conf"]
systemd-units = { unit-name = "ophan", unit-scripts = "../packaging/deb/", enable = true, start = false, restart-after-upgrade = false, stop-on-upgrade = false }

[dependencies]
ophan-net = { workspace = true }
ophan-auth = { workspace = true }
ophan-sec = { workspace = true }
ophan-static = { workspace = true }
ophan-router = { workspace = true }

flatkit = { workspace = true }
cli = { workspace = true }

pingora = { workspace = true, features = ["proxy", "s2n"] }
prometheus = { workspace = true }
mimalloc = { workspace = true }
libmimalloc-sys = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["time"] }
regex = { workspace = true }
http = { workspace = true }

uuid = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
serde = { workspace = true }

async-trait = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

hashbrown = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
ahash = { workspace = true }
memchr = { workspace = true }

## Used for loggs
tracing = { workspace = true, features = [
    "max_level_debug",
    "release_max_level_warn",
] }
tracing-log = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "~0.31.1", default-features = false, features = [
    "process",
    "signal",
    "user",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[[bench]]
name = "load-balancer"
harness = false

[[bench]]
name = "ref_or_copy"
harness = false

[[bench]]
name = "upstream_lookup"
harness = false

[[bench]]
name = "url_rewriting"
harness = false

[dev-dependencies]
httpmock = "0.8.3"
rayon = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = { workspace = true }
