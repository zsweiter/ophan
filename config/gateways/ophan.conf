# =============================================
# OPHAN EDGE GATEWAY - Configuration v1
# =============================================

name = "edge-gateway-prod" # kebab-case

## Things to keep in mind
# names must always be lowercase kebab-case or snake_case without spaces

# ==================== LISTENERS (REQUEST INCOMING) ====================
listeners {
    # This is the full listener configuration
    listener "https" {
        address   = "0.0.0.0:443" # supported values: unix sockets, domains, ip:port, transport(unix|tcp|udp):ip:port
        protocols = ["http1", "http2"] # supported values (http1, http2, websocket, grpc)

        ssl {
            cert = "/etc/ophan/certs/cert.pem"
            key  = "/etc/ophan/certs/key.pem"
            # client_ca = "xxx" # mTLS
        }
    }

    # This is the minimal listener configuration
    listener "http" {
        address = "0.0.0.0:80"
    }
}

# ==================== UPSTREAMS (CLUSTERS) ====================
upstreams {
    ## Full upstream configuration
    upstream "api" {
        servers = { endpoint = "localhost:4040", weight = 100 }

        load_balance = "round_robin" # supported algorithms (least_connections, round_robin, ip_hash, random)

        health_check = {
            path = "/",
            interval = 10,
            timeout = 100,
            unhealthy_threshold = 20,
            healthy_threshold = 10,
        }
    }

    # Minimal required upstream configuration
    upstream "auth" {
        servers = "auth-service:9000"
    }
}

# ==================== ROUTES ====================
# Paths are ANSI-compatible, meaning they support complex regex patterns.
routes {
    # Static backend (files)
    route "/" {
        hosts = ["blob.domain.com", "storage.domain.com"] # Match against Host header

        backend = static {
            root     = "/var/www/public"
            listing  = false
            dotfiles = false
            permissions = 0060
            disallow = ["/docs/*", "/dirs/.(enc|data)"] # glob pattern
        }
    }

    ## Full configuration with upstream backend
    route "/api/*" {
        hosts   = ["api.example.me", "payments.domain.com"] # Match against Host header
        methods = ["GET", "POST", "PUT", "PATCH", "DELETE"]

        backend = upstream("api")

        policies {
            # Allows overriding global configuration
            auth extends "oauth-default" { 
                sources {
                    cookie { name = "access_token" }
                }
            }

            cors extends "cors-default" {
                allow_origin      = ["https://app.example.com"]
                allow_methods     = ["GET", "POST", "OPTIONS"]
                allow_headers     = ["*"]
                allow_credentials = true
                max_age = 7200
            }

            limiter = "limiter-default"
        }

        rewrite {
            "/api/*" -> "/$1"
        }

        headers {
            add    = { X-Forwarded-By = "Ophan-Edge" }
            set    = { Cache-Control = "no-store" }
            remove = ["Server", "X-Powered-By"]
        }
    }
}

# ==================== GLOBAL POLICIES ====================
policy auth "oauth-default" {
    issuer     = "https://auth.example.com" 
    client_id  = "auth-gateway-client"
    audience   = "https://frontend.com" 

    # JWKS endpoint for token verification
    jwks_uri   = "https://auth.example.com/.well-known/jwks.json"
    jwks_ttl   = "1h" # Cache duration for the JwkStore

    # Access token sources
    sources {
        header { name = "Authorization" prefix = "Bearer " }
        cookie { name = "access_token" }
    }

    # Explicit refresh token lifecycle configuration
    refresh {
        enabled = true
        endpoint = "https://auth.example.com/oauth/token"
        
        # Sources used to extract the refresh token
        sources {
            cookie { name = "refresh_token" }
            header { name = "X-Refresh-Token" }
        }
    }
}

policy cors "cors-default" {
    allow_origin  = ["app.example.me", "example.me", "admin.example.me", "api.example.me"]
    allow_methods = ["GET", "POST", "DELETE", "PUT", "PATCH", "HEAD", "OPTIONS"]
    allow_headers = ["Authorization", "X-Request-Id", ""]
    allow_credentials = true
    max_age = 7200
}

policy limiter "limiter-default" {
    rate = 10/s # s(second)|m(minute)|h(hour)|d(day)
    identifier = "ip"
}