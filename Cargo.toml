[workspace]
resolver = "2"
members = [
    "ophan",
    "libs/ophan-net",
    "libs/ophan-auth",
    "libs/ophan-static",
    "libs/ophan-sec",
    "libs/ophan-router",
    "shared/flatkit",
    "shared/cache",
    "libs/ophan-bpf",
]
default-members = ["ophan"]

[workspace.dependencies]
flatkit = { path = "./shared/flatkit" }
cache = { path = "./shared/cache" }

ophan-net = { path = "./libs/ophan-net" }
ophan-auth = { path = "./libs/ophan-auth" }
ophan-static = { path = "./libs/ophan-static" }
ophan-sec = { path = "./libs/ophan-sec" }
ophan-router = { path = "./libs/ophan-router" }

pingora = { version = "0.8", default-features = false }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7.18", features = ["io"] }
futures = { version = "0.3" }

serde = { version = "1", features = ["derive"] }
jsonwebtoken = { version = "11.0.0" }
serde_json = "1"
base64 = "0.23.1"
mime_guess = "2.0.5"
memmap2 = "0.9.10"
url = "2"
regex = "1"
sha2 = "0.11.0"
memchr = "2.7"
crossbeam-queue = "0.3"
bitflags = "2.13.1"

aho-corasick = "1.1"

uuid = { version = "1", default-features = false, features = ["v4"] }
pest = { version = "2.7", default-features = false }
pest_derive = { version = "2.7" }

async-trait = "0.1.42"
bytes = "1.2"

hashbrown = "0.17.1"
dashmap = "6.2.1"
arc-swap = "1.9.1"
parking_lot = "0.12.5"
ahash = "0.8.12"
fastbloom-rs = "0.5.10"

## Used for loggs
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

## Http and networking
httparse = "1"
s2n-tls = "0.3"
s2n-tls-tokio = "0.3"
http = "1.4"
http-body-util = "0.1"
itoa = "1.0"
form_urlencoded = "1.2"
httpdate = "1.0.3"

## For testing & benchmarking
httpmock = "0.8.3"
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.12.0"

tempfile = "3"

[profile.dev]
debug = 1
opt-level = 0

[profile.bench]
debug = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
debug = 1
