# Default gateway of the container image. Mount /etc/ophan to replace it.
name = "ophan"

listeners {
    listener "http" {
        address   = "0.0.0.0:80"
        protocols = ["http1", "http2"]
    }

    # Shared through the /run/ophan volume with a proxy in front (cloudflared, nginx, ...).
    # The proxy must send the client address in X-Forwarded-For; requests without it get 400.
    listener "uds" {
        address     = "unix:/run/ophan/ophan_gateway.sock"
        protocols   = ["http1", "http2"]
        permissions = "0666"

        trusted_proxies {
            real_ip_header = "X-Forwarded-For"
        }
    }
}

routes {
    route "/*" {
        backend = static("/var/www")

        static_config {
            listing  = false
            dotfiles = false
            index    = true
        }
    }
}
