name: CI

on:
    pull_request:
    push:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install rust
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2

            - name: Format check
              env:
                  ENABLE_XDP: false
              run: cargo fmt --all -- --check

            - name: Clippy
              env:
                  ENABLE_XDP: false
              run: cargo clippy --all-targets -- -D warnings

    test:
        needs: lint
        strategy:
            fail-fast: true
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - os: macos-latest
                      target: x86_64-apple-darwin
                    - os: macos-latest
                      target: aarch64-apple-darwin
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v5

            - name: Install rust
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  target: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  cache-all-crates: "true"
                  prefix-key: "v1-rust-cache-${{ matrix.os }}-${{ matrix.target }}"

            - name: Test
              env:
                  ENABLE_XDP: false
              run: cargo test --all --exclude ophan-bpf
