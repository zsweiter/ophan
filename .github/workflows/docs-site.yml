name: Deploy Ophan Docs Site

on:
    push:
        branches:
            - main
        paths:
            - "docs/public/**"
            - ".github/workflows/docs.yml"

    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

env:
    BUILD_PATH: ./docs/public

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Detect package manager
              id: detect-package-manager
              working-directory: ${{ env.BUILD_PATH }}
              shell: bash
              run: |
                  if [ -f "pnpm-lock.yaml" ]; then
                    echo "manager=pnpm" >> "$GITHUB_OUTPUT"
                    echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
                    echo "runner=pnpm exec" >> "$GITHUB_OUTPUT"
                    echo "cache=pnpm" >> "$GITHUB_OUTPUT"
                    echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"

                  elif [ -f "yarn.lock" ]; then
                    echo "manager=yarn" >> "$GITHUB_OUTPUT"
                    echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
                    echo "runner=yarn" >> "$GITHUB_OUTPUT"
                    echo "cache=yarn" >> "$GITHUB_OUTPUT"
                    echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"

                  elif [ -f "package-lock.json" ]; then
                    echo "manager=npm" >> "$GITHUB_OUTPUT"
                    echo "install=npm ci" >> "$GITHUB_OUTPUT"
                    echo "runner=npx --no-install" >> "$GITHUB_OUTPUT"
                    echo "cache=npm" >> "$GITHUB_OUTPUT"
                    echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"

                  elif [ -f "package.json" ]; then
                    echo "manager=npm" >> "$GITHUB_OUTPUT"
                    echo "install=npm install" >> "$GITHUB_OUTPUT"
                    echo "runner=npx --no-install" >> "$GITHUB_OUTPUT"
                    echo "cache=npm" >> "$GITHUB_OUTPUT"
                    echo "lockfile=package.json" >> "$GITHUB_OUTPUT"

                  else
                    echo "No package manager found in $PWD"
                    exit 1
                  fi

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: ${{ steps.detect-package-manager.outputs.cache }}
                  cache-dependency-path: ${{ env.BUILD_PATH }}/${{ steps.detect-package-manager.outputs.lockfile }}

            - name: Setup pnpm
              if: steps.detect-package-manager.outputs.manager == 'pnpm'
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              run: ${{ steps.detect-package-manager.outputs.install }}
              working-directory: ${{ env.BUILD_PATH }}

            - name: Build with Astro
              run: |
                  ${{ steps.detect-package-manager.outputs.runner }} astro build \
                    --site "${{ steps.pages.outputs.origin }}" \
                    --base "${{ steps.pages.outputs.base_path }}"
              working-directory: ${{ env.BUILD_PATH }}

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ${{ env.BUILD_PATH }}/dist

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
