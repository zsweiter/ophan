# ═══════════════════════════════════════════════════════════════
# Ophan API Gateway — Release Pipeline
#
# Triggered by: git tag v[0-9]+.[0-9]+.[0-9]+*
# Builds for:   Linux (x86_64), macOS (x86_64, aarch64), Windows (x86_64)
# Outputs:      .tar.gz / .zip + .sha256 checksums
# ═══════════════════════════════════════════════════════════════

name: Release

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
    contents: write

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      pkg_os: linux
                      pkg_arch: x86_64
                      ext: tar.gz

                    # - os: ubuntu-latest
                    #   target: x86_64-unknown-linux-musl
                    #   pkg_os: linux
                    #   pkg_arch: x86_64-musl
                    #   ext: tar.gz

                    - os: macos-latest
                      target: x86_64-apple-darwin
                      pkg_os: macos
                      pkg_arch: x86_64
                      ext: tar.gz

                    - os: macos-latest
                      target: aarch64-apple-darwin
                      pkg_os: macos
                      pkg_arch: aarch64
                      ext: tar.gz

                    # - os: windows-latest
                    #   target: x86_64-pc-windows-msvc
                    #   pkg_os: windows
                    #   pkg_arch: x86_64
                    #   ext: zip

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v5

            - name: Install rust
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  target: ${{ matrix.target }}

            - name: Build release
              run: cargo build --release --target ${{ matrix.target }}

            - name: Install UPX
              if: matrix.os == 'ubuntu-latest'
              run: sudo apt-get update && sudo apt-get install -y upx

            - name: Compress binary
              if: matrix.os == 'ubuntu-latest'
              run: upx -1 target/${{ matrix.target }}/release/ophan

            - name: Package artifacts
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  NAME="ophan-${VERSION}-${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}"
                  DIST="dist/$NAME"

                  mkdir -p "$DIST/stubs"

                  BIN="target/${{ matrix.target }}/release/ophan"

                  if [ "${{ matrix.pkg_os }}" = "windows" ]; then
                    BIN="${BIN}.exe"
                  fi

                  cp "$BIN" "$DIST/"
                  cp -r config "$DIST/"

                  if [ "${{ matrix.pkg_os }}" = "linux" ]; then
                    cp stubs/systemd.service "$DIST/stubs/"
                  elif [ "${{ matrix.pkg_os }}" = "macos" ]; then
                    cp stubs/io.ophan.ophan.plist "$DIST/stubs/"
                  elif [ "${{ matrix.pkg_os }}" = "windows" ]; then
                    cp stubs/windows-service.ps1 "$DIST/stubs/"
                    cp scripts/install.ps1 "$DIST/"
                  fi

                  cp README.md LICENSE* "$DIST/" 2>/dev/null || true

                  cd dist

                  if [ "${{ matrix.ext }}" = "tar.gz" ]; then
                    tar -czf "$NAME.tar.gz" "$NAME"
                  else
                    zip -r "$NAME.zip" "$NAME"
                  fi

                  sha256sum "$NAME.${{ matrix.ext }}" > "$NAME.${{ matrix.ext }}.sha256" || true

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}
                  path: dist/*
