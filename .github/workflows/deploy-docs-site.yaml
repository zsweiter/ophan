name: Deploy Ophan Docs Site

on:
    push:
        branches:
            - main
        paths:
            - "docs/public/**"
            - ".github/workflows/docs.yml"

    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

env:
    BUILD_PATH: docs/public

jobs:
    build:
        name: Build Astro
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Detect package manager
              id: package-manager
              working-directory: ${{ env.BUILD_PATH }}
              shell: bash
              run: |
                  if [ -f pnpm-lock.yaml ]; then
                    echo "manager=pnpm" >> "$GITHUB_OUTPUT"
                    echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
                    echo "runner=pnpm exec" >> "$GITHUB_OUTPUT"

                  elif [ -f yarn.lock ]; then
                    echo "manager=yarn" >> "$GITHUB_OUTPUT"
                    echo "install=yarn install --immutable" >> "$GITHUB_OUTPUT"
                    echo "runner=yarn" >> "$GITHUB_OUTPUT"

                  elif [ -f package-lock.json ]; then
                    echo "manager=npm" >> "$GITHUB_OUTPUT"
                    echo "install=npm ci" >> "$GITHUB_OUTPUT"
                    echo "runner=npx --no-install" >> "$GITHUB_OUTPUT"

                  else
                    echo "::error::No supported package manager lockfile found."
                    exit 1
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: ${{ steps.package-manager.outputs.manager }}
                  cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

            - name: Setup GitHub Pages
              id: pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              working-directory: ${{ env.BUILD_PATH }}
              run: ${{ steps.package-manager.outputs.install }}

            - name: Build Astro site
              working-directory: ${{ env.BUILD_PATH }}
              run: |
                  ${{ steps.package-manager.outputs.runner }} astro build \
                    --site "${{ steps.pages.outputs.origin }}" \
                    --base "${{ steps.pages.outputs.base_path }}"

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ${{ env.BUILD_PATH }}/dist

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
